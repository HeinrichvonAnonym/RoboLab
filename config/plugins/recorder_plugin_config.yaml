topic:
  - franka/command
  - franka/state
  - franka/cartesian_dpose
  - HumanState
  # - kinec2/depth
  - kinec2/rgb
  # - realsense/depth
  - realsense/rgb

# Map each topic to its protobuf message type for structured HDF5 storage.
# The recorder parses protobuf and writes each field as a separate dataset.
# Repeated fields (like joints) are stored as 2D arrays [n_messages, n_elements].
topic_proto:
  franka/command: franka.RobotCommand
  franka/state: franka.RobotObservation
  franka/cartesian_dpose: franka.CartesianDPoseCmd
  HumanState: demo_inference.Observation
  # kinec2/depth: kinect.rgbImage
  kinec2/rgb: kinect.rgbImage
  # realsense/depth: kinect.rgbImage
  realsense/rgb: kinect.rgbImage

record_frequency: 30

# Record only during inference (the robot's running state). Leaving inference
# finalizes one HDF5 file; init, gohome and standby samples are ignored.
state_machine_topic: franka/state_machine
recording_state: inference
# These settings checkpoint the active episode into the SAME temporary file.
# It becomes a .h5 file when the episode ends, without splitting the episode.
anchor_topic: franka/state
# Flush roughly once per second rather than retaining tens of seconds of raw images.
flush_anchor_count: 30
# Also request a flush when image payloads reach this size, even if the anchor stalls.
flush_buffer_mb: 256

# F1 checkpoints the active episode; F2 -> standby finalizes the episode.
next_record_topic: next_record
