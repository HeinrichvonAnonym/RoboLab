# Standalone Python subscriber; Kinect must already be publishing RGB.
# Run: python src/plugins/python/hand_tracker_plugin.py --config <this file>
topic:
  rgb: "kinec2/rgb"

# Pixel byte order, NOT protobuf's type field (Kinect uses BGRX; RealSense uses RGB).
input_color_format: "BGRX"  # BGRX, RGBX, BGR, RGB
enable_viewer: true
viewer_max_width: 1280
fps: 20

num_hands: 2
min_hand_detection_confidence: 0.5
min_hand_presence_confidence: 0.5
min_tracking_confidence: 0.5

# CPU MediaPipe Tasks model; missing models are downloaded atomically and cached.
model_path: "~/.cache/robolab/mediapipe/hand_landmarker.task"
auto_download_model: true

# Empty uses Zenoh's default peer discovery. Example: ["tcp/127.0.0.1:7447"]
zenoh:
  connect: []
