# IMU 6DOF teleop: hand-held N100 → Franka Cartesian control.
#
# The plugin subscribes to imu_topic, filters the acceleration into velocity
# commands, computes orientation deltas from AHRS quaternions, and publishes
# franka::CartesianDPoseCmd on cmd_topic.

imu_topic: "imu/data"
cmd_topic: "franka/cartesian_dpose"

# Bandpass filter parameters (per-axis, independent).
highpass_alpha: 0.98       # high-pass coefficient (removes gravity/DC), range [0.9, 0.99]
lowpass_beta: 0.2          # low-pass coefficient (smooths noise), range [0.05, 0.5]
velocity_decay: 0.95       # per-frame velocity decay (fights drift), range [0.9, 0.99]

# Dead-zone and scaling.
velocity_threshold: 0.2  # m/s — velocities below this are zeroed
linear_scale: 0.0   # velocity → position increment scale (start small!)
angular_scale: 0.3      # quaternion delta → euler increment scale

# Safety limits.
max_linear_vel: 0.1        # m/s — hard clamp on filtered velocity
max_angular_vel: 0.3       # rad/s — hard clamp on angular increment
